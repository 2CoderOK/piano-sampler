[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piano-sampler"
version = "0.1.1"
description = "Simple piano sampler based on pygame"
readme = "README.md"
license = { file = "LICENSE" }
authors = [ { name = "2CoderOK" } ]
requires-python = ">=3.10"
keywords = ["audio", "piano", "sampler"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

dependencies = [
    "mido==1.3.3", 
    "pygame==2.6.1",
    "python-rtmidi==1.5.8"
]

[project.scripts]
piano-sampler = "piano_sampler.main:main"

[project.urls]
Homepage = "https://github.com/2coderok/piano-sampler"
Issues = "https://github.com/2coderok/piano-sampler/issues"

[tool.hatch.build]
include = [
    "piano_sampler/**/*.py",
    "piano_sampler/piano_samples.zip",
]

[tool.hatch.build.targets.wheel]
packages = ["piano_sampler"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.sdist]
include = [
    "piano_sampler/",
    "README.md",
    "LICENSE",
    "assets/",  # Included in source distribution for GitHub/Reference
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]